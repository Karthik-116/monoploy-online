<!doctype html>
<html lang="en" data-theme="night">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#191430" />
  <meta name="description" content="Play Monopoly with friends in your browser — no download, works on phones." />
  <title>Monopoly Online</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='3' y='3' width='26' height='26' rx='7' fill='%238d7bff'/><circle cx='11' cy='11' r='3' fill='%23140f2a'/><circle cx='21' cy='21' r='3' fill='%23140f2a'/></svg>" />
  <link rel="preload" href="/fonts/nunito-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/oswald-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/css/themes.css" />
  <link rel="stylesheet" href="/css/style.css" />
  <script>
    // Apply the saved theme before first paint (older ids map to the new ones).
    try {
      var t = localStorage.getItem('mono.theme');
      t = { dark: 'night', light: 'daylight' }[t] || t || 'night';
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <a class="wordmark" href="/" aria-label="Monopoly Online home"><span class="mark" aria-hidden="true"></span>Monopoly</a>
    <div class="top-actions">
      <div id="roomChip" class="room-chip hidden">
        <span class="lbl muted">Room</span> <b id="roomCode"></b>
        <button id="shareTop" class="icon-btn" type="button" aria-label="Share invite link" title="Share invite link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="m16 6-4-4-4 4"/><path d="M12 2v13"/></svg>
        </button>
      </div>
      <button id="nothingBtn" class="btn btn-ghost btn-sm hidden" type="button">Nothing</button>
      <div class="menu">
        <button id="themeBtn" class="icon-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Change colour theme" title="Colour theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22a10 10 0 1 1 10-10c0 2.8-2.2 4-4 4h-2a2 2 0 0 0-1.4 3.4A1.6 1.6 0 0 1 12 22z"/><circle cx="7.5" cy="10.5" r="1.2"/><circle cx="12" cy="7" r="1.2"/><circle cx="16.5" cy="10.5" r="1.2"/></svg>
        </button>
        <div id="themeMenu" class="menu-pop hidden" role="menu"></div>
      </div>
      <button id="soundBtn" class="icon-btn" type="button" aria-label="Mute sounds" title="Sound on/off"></button>
      <button id="leaveBtn" class="icon-btn hidden" type="button" aria-label="Leave room" title="Leave room">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
    </div>
  </header>

  <!-- Home: create or join -->
  <main id="homeView" class="home">
    <div class="home-inner">
      <div id="homeDice" class="home-dice" title="Roll the dice" role="button" tabindex="0" aria-label="Roll the dice"></div>
      <h1>Monopoly with friends, right in your browser</h1>
      <p class="lede">Make a room, send the link, and play on any phone or laptop. No download, no sign-up.</p>
      <div class="home-card">
        <label for="homeName">Your name</label>
        <input id="homeName" class="field" maxlength="20" placeholder="e.g. Asha" autocomplete="nickname" />
        <button id="createBtn" class="btn btn-primary btn-lg btn-block" type="button">Create a room</button>
        <div class="or">have a room code?</div>
        <div class="join-row">
          <input id="joinCode" class="field" maxlength="5" placeholder="ABCDE" aria-label="Room code" autocomplete="off" />
          <button id="joinBtn" class="btn" type="button">Join</button>
        </div>
        <p id="homeError" class="form-error" role="alert"></p>
      </div>
    </div>
  </main>

  <!-- Room: lobby and game share one layout -->
  <main id="roomView" class="room hidden" data-tab="players">
    <section class="panel area-share">
      <h2 class="panel-title">Share this game</h2>
      <div class="share-row">
        <input id="inviteLink" class="field" readonly aria-label="Invite link" />
        <button id="copyLink" class="btn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>
          <span>Copy</span>
        </button>
      </div>
    </section>

    <section class="area-board">
      <div id="boardScroll" class="board-scroll">
        <div id="boardWrap" class="board-wrap">
          <div id="board" class="board"></div>
          <div id="pawns" class="pawns" aria-hidden="true"></div>
        </div>
      </div>
      <button id="zoomBtn" class="btn btn-sm zoom-btn" type="button">Zoom in on the board</button>
    </section>

    <div id="dock" class="dock"></div>

    <nav class="tabs" role="tablist" aria-label="Room panels">
      <button type="button" role="tab" data-tab="players" aria-selected="true">Players</button>
      <button type="button" role="tab" data-tab="chat" aria-selected="false">Chat</button>
      <button type="button" role="tab" data-tab="side" aria-selected="false" id="sideTab">Settings</button>
    </nav>

    <section class="panel area-players">
      <ul id="playerList" class="player-list"></ul>
      <div id="youRow" class="you-row hidden">
        <button id="appearanceBtn" class="btn btn-sm" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22a10 10 0 1 1 10-10c0 2.8-2.2 4-4 4h-2a2 2 0 0 0-1.4 3.4A1.6 1.6 0 0 1 12 22z"/></svg>
          Change appearance
        </button>
      </div>
    </section>

    <section class="panel area-side">
      <div id="sidePanel" class="panel-scroll"></div>
    </section>

    <section class="panel area-feed">
      <h2 class="panel-title">Chat</h2>
      <div id="feedScroll" class="panel-scroll">
        <ul id="feed" class="feed"></ul>
      </div>
      <form id="chatForm" class="chat-form" autocomplete="off">
        <input id="chatInput" class="field" maxlength="200" placeholder="Say something…" aria-label="Chat message" />
        <button class="icon-btn" type="submit" aria-label="Send message">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/></svg>
        </button>
      </form>
    </section>
  </main>

  <div id="modal" class="modal hidden"><div id="modalCard" class="modal-card" role="dialog" aria-modal="true"></div></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="fx" class="fx" aria-hidden="true"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
